<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#10243c"/><title>Pathline — Interactive Prototype</title><style>:root {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  color: #14263c;
  background: #f7f8f7;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  --navy: #112640;
  --navy-deep: #0a1b30;
  --gold: #c5a15c;
  --gold-bright: #dfbd78;
  --ink: #15293f;
  --muted: #758396;
  --line: #e6eaf0;
  --surface: #fff;
  --light: #f7f8fa;
  --green: #337666;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-width: 320px; }
button, input, textarea, select { font: inherit; }
button { cursor:pointer; }
button:disabled { cursor:not-allowed; opacity:.52; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline:3px solid #c5a15c82; outline-offset:3px; }
button { -webkit-tap-highlight-color: transparent; }
svg.icon { flex-shrink:0; vertical-align:middle; }
.site-header { height:82px; background:rgba(255,255,255,.98); position:sticky;top:0;z-index:30;border-bottom:1px solid #e8eaf0; }
.header-inner { max-width:1500px;height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:0 49px;gap:30px; }
.logo-button {display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;color:var(--ink);white-space:nowrap;}
.brand-symbol {width:32px;height:32px;border-radius:9px;background:var(--navy);position:relative;overflow:hidden;flex-shrink:0;}
.brand-line { position:absolute;width:17px;height:17px;border-top:3px solid var(--gold-bright);border-right:3px solid var(--gold-bright);border-radius:0 13px 0 0;left:7px;top:8px;transform:rotate(-3deg);}
.brand-line::after {content:"";position:absolute;width:10px;height:3px;background:var(--gold-bright);left:-2px;top:12px;border-radius:2px;}
.brand-word{font-weight:760;letter-spacing:-1.5px;font-size:24px;}
.brand-period{color:var(--gold);}
.top-nav{display:flex;align-items:center;align-self:stretch;gap:32px;margin-left:auto;}
.nav-link{position:relative;border:0;background:transparent;color:#788293;font-size:13px;font-weight:650;display:flex;align-items:center;gap:7px;padding:0 0;white-space:nowrap;}
.nav-link.active{color:var(--navy);}
.nav-link.active::after{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--gold);content:"";}
.nav-link:not(:disabled):hover,.side-link:hover{color:var(--navy);}
.nav-count{border-radius:40px;color:#fff;background:var(--green);font-size:10px;line-height:16px;padding:0 6px;}
.header-actions{display:flex;align-items:center;gap:18px;margin-left:28px;}
.header-demo{white-space:nowrap;font-size:10px;color:#647386;letter-spacing:1.1px;font-weight:750;display:flex;gap:8px;align-items:center;}
.header-demo .icon{fill:#b58c44;color:#b58c44;}
.header-avatar{border:1px solid #e0e5ec;background:#e9edf2;color:#334962;font-size:11px;font-weight:800;width:36px;height:36px;border-radius:50%;}
.mobile-menu{display:none;background:none;border:0;color:var(--ink);}
.mobile-nav{display:none;}
.site-footer{min-height:82px;background:#fff;border-top:1px solid var(--line);padding:25px max(24px,calc((100vw - 1440px)/2 + 44px));display:flex;align-items:center;justify-content:space-between;gap:20px;color:#8793a2;font-size:11px;}
.site-footer>div{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.site-footer .footer-brand{color:var(--navy);font-size:18px;font-weight:780;letter-spacing:-1px;margin-right:13px;}
.footer-dot{color:#bac3ce;}
.site-footer button{border:0;background:none;font-size:11px;color:#66788d;padding:3px 0;display:inline-flex;align-items:center;gap:4px;}
.site-footer button:hover{color:var(--navy);}
.btn{border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 21px;border-radius:9px;font-size:13px;font-weight:750;line-height:1.15;transition:transform .12s,box-shadow .12s,background .15s;white-space:nowrap;}
.btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 7px 17px #182c4915;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:not(:disabled):hover{background:#1d3957;}
.btn-outline{background:white;color:var(--navy);border-color:#d8e0e8;}
.btn-outline:hover{border-color:#95a9b7;}
.btn-text{background:transparent;color:#657488;padding-left:5px;}
.btn-full{width:100%;}
.btn .icon{vertical-align:middle;}
.pill{font-size:10px;display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:7px 10px;font-weight:750;white-space:nowrap;letter-spacing:.1px;}
.pill-muted{background:#f0f2f5;color:#7a8796;}
.pill-gold{background:#f6efdF;color:#95703c;}
.pill-green{background:#e8f2ee;color:#347760;}
.eyebrow{letter-spacing:1.9px;font-size:11px;font-weight:800;color:#6d798a;display:flex;align-items:center;gap:12px;}
.gold-line{width:26px;height:2px;background:var(--gold);display:inline-block;}
.eyebrow-label{color:#8b98a6;letter-spacing:1.4px;font-size:10px;font-weight:800;}
.gold-dot{color:var(--gold);}
.serif-emphasis{font-family:Georgia,'Times New Roman',serif;font-weight:500;font-style:italic;color:var(--gold);}
/* WELCOME */
.welcome-page{position:relative;background:linear-gradient(118deg,#f5f8f8 0%,#fbfaf6 60%,#f4f1e8 100%);min-height:calc(100vh - 165px);overflow:hidden;}
.welcome-graphic{pointer-events:none;position:absolute;border:1px solid #c3aa7433;border-radius:50%;}
.welcome-graphic.one{width:830px;height:830px;right:-590px;top:-390px;}
.welcome-graphic.two{width:1060px;height:1060px;right:-800px;top:-515px;}
.welcome-inner{width:100%;max-width:1370px;min-height:700px;margin:0 auto;display:grid;grid-template-columns:1.16fr .86fr;gap:76px;align-items:center;padding:70px 58px 90px;position:relative;}
.hero-copy{padding:0 0 30px;}
.hero-copy h1{font-size:clamp(49px,5.3vw,82px);line-height:1.09;letter-spacing:-4.8px;color:#112640;font-weight:680;margin:28px 0 25px;}
.hero-copy .serif-emphasis{letter-spacing:-4px;}
.hero-subtitle{font-size:17px;line-height:1.8;color:#667589;max-width:565px;margin:0 0 40px;}
.hero-attributes{display:grid;gap:17px;margin-bottom:48px;}
.hero-attributes>div{font-size:13px;font-weight:650;display:flex;align-items:center;gap:12px;color:#32475c;}
.hero-attributes svg{color:#b59451;}
.social-proof{display:flex;align-items:center;gap:18px;margin-top:43px;}
.overlap-circles{display:flex;padding-left:4px;}
.overlap-circles span{margin-left:-4px;background:#d9e3e4;color:#527174;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fafafa;font-size:9px;font-weight:750;}
.overlap-circles span:nth-child(2){background:#d8ded0;color:#7a866b;}.overlap-circles span:nth-child(3){background:#eee5dc;color:#a28b73;}
.social-proof p{font-size:11px;line-height:1.6;color:#8290a0;margin:0;}.social-proof strong{color:#273c52;font-size:12px;}
.welcome-panel{background:white;position:relative;z-index:1;border:1px solid #eceff2;border-radius:17px;padding:40px 39px 27px;box-shadow:0 26px 65px #19304716,0 3px 8px #19304704;}
.panel-top{display:flex;align-items:center;justify-content:space-between;color:#bc9857;font-weight:820;font-size:10px;letter-spacing:1.8px;margin-bottom:22px;}
.panel-top span:last-child{color:#a3aebb;letter-spacing:1.1px;}
.welcome-panel h2{font-size:29px;line-height:1.18;letter-spacing:-1.2px;font-weight:690;margin:0 0 13px;color:var(--navy);}
.welcome-panel>p{font-size:13px;color:#778698;line-height:1.7;margin:0 0 29px;}
.welcome-panel label,.form-panel label{display:block;color:#34485b;font-size:12px;font-weight:750;margin:0 0 10px;}
.input-shell{display:flex;align-items:center;border:1px solid #dfe5eb;border-radius:8px;gap:12px;margin-bottom:22px;padding:0 15px;height:49px;color:#97a5b3;background:#fff;}
.input-shell:focus-within{border-color:#bc9a59;box-shadow:0 0 0 3px #bd9a5620;}
.input-shell input{height:100%;border:0;outline:none;flex:1;min-width:0;color:var(--ink);font-weight:560;font-size:13px;}
.input-shell input:focus-visible{outline:none;}
.select-shell{height:49px;display:flex;align-items:center;border:1px solid #dfe5eb;border-radius:8px;margin-bottom:25px;padding:0 13px;}
.select-shell select{width:100%;height:100%;border:0;appearance:none;background:transparent;outline:0;color:#24374c;font-size:13px;font-weight:560;}
.select-shell svg{color:#8996a4;}
.panel-foot{display:flex;align-items:center;justify-content:center;gap:7px;font-size:10px;color:#98a3af;margin:18px 0 0;}
.welcome-bottom{height:64px;padding:0 max(50px,calc((100vw - 1370px)/2 + 58px));border-top:1px solid #e8e9e4;display:flex;align-items:center;justify-content:space-between;color:#a0a5a9;font-size:10px;font-weight:800;letter-spacing:1.6px;}
/* ONBOARD */
.page{min-height:calc(100vh - 164px);background:#fbfbfa;}
.page-container{max-width:1340px;margin:auto;padding:38px 52px 80px;}
.stepper{display:flex;align-items:center;justify-content:center;gap:25px;max-width:680px;margin:0 auto 56px;}
.stepper-item{display:flex;gap:9px;align-items:center;font-size:12px;color:#a1aab5;font-weight:650;white-space:nowrap;}
.step-num{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid #dce2e9;border-radius:50%;font-size:11px;}
.stepper-item.current{color:var(--navy);}.stepper-item.current .step-num{background:var(--navy);color:#fff;border-color:var(--navy);}
.stepper-item.done{color:#5e7e72;}.stepper-item.done .step-num{color:#fff;background:#5b8d7c;border-color:#5b8d7c;}
.step-divider{background:#dfe4e9;height:1px;flex:1;max-width:52px;}
.onboard-layout,.skills-layout{display:grid;grid-template-columns:.9fr 1fr;gap:72px;align-items:start;}
.section-eyebrow{color:#b08c4e;margin-top:48px;}
.page-display{font-size:clamp(42px,4vw,62px);line-height:1.15;letter-spacing:-3.1px;font-weight:670;color:var(--navy);margin:22px 0;}
.page-display .serif-emphasis{letter-spacing:-3px;}
.lead-copy{color:#78869a;font-size:16px;line-height:1.8;max-width:490px;margin:0;}
.story-guidance{display:flex;gap:14px;background:#fff;border:1px solid #ebeef1;border-radius:10px;margin-top:49px;padding:21px 22px;max-width:465px;}
.guidance-icon{color:#ad8449;margin-top:1px;}
.story-guidance strong{font-size:13px;color:var(--ink);}.story-guidance p{color:#8190a0;font-size:12px;line-height:1.7;margin:7px 0 0;}
.reflection-quote{margin-top:53px;border-top:1px solid #e0e5e7;padding-top:23px;max-width:430px;}
.quote-mark{font-family:Georgia,serif;font-size:40px;color:var(--gold);height:20px;display:block;}
.reflection-quote p{font-family:Georgia,serif;font-size:19px;line-height:1.6;font-style:italic;color:#6b7a8c;margin:9px 0 14px;}
.quote-author{font-size:9px;letter-spacing:1.5px;color:#a5afba;font-weight:800;}
.form-panel{background:#fff;border:1px solid #e7eaef;border-radius:14px;box-shadow:0 18px 42px #29405e0a;overflow:hidden;}
.form-panel-header{display:flex;justify-content:space-between;align-items:center;padding:23px 29px;background:#fafbfc;border-bottom:1px solid #eff1f3;}
.mini-label{font-size:9px;letter-spacing:1.45px;color:#b1935a;font-weight:850;}
.form-panel-header h2{margin:6px 0 0;font-size:20px;letter-spacing:-.7px;}
.form-panel-body{padding:28px 29px;}
.form-panel label{margin:0 0 9px;}.form-panel label:not(:first-child){margin-top:21px;}
.form-panel label span{font-weight:450;color:#99a5b2;}
.field{width:100%;border:1px solid #dfe5eb;border-radius:8px;font-size:12px;color:#304256;padding:13px 14px;outline:0;background:#fff;line-height:1.65;}
.field:focus{border-color:#bb9555;box-shadow:0 0 0 3px #c4a06324;}
.field-textarea{resize:vertical;min-height:66px;}
.form-helper{font-size:11px;color:#8c98a7;line-height:1.65;display:flex;gap:8px;align-items:flex-start;margin-top:18px;}
.form-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #e9edf0;margin-top:25px;padding-top:23px;}
.skills-layout{grid-template-columns:.82fr 1.1fr;gap:80px;}
.translation-graphic{display:flex;align-items:stretch;gap:12px;margin-top:55px;max-width:490px;}
.translation-box{border:1px solid #dfe4e8;background:white;border-radius:10px;padding:18px;flex:1;min-width:0;}
.translation-box span{font-size:9px;letter-spacing:1.1px;color:#9aa5b1;font-weight:800;display:block;margin-bottom:11px;}.translation-box strong{font-size:13px;color:#233c56;}
.translation-box.highlight{background:#162c48;border-color:#162c48;}.translation-box.highlight span{color:#c8b182;}.translation-box.highlight strong{color:#fff;}
.translation-arrow{display:flex;align-items:center;color:#b8a27a;}
.subtle-note{display:flex;gap:11px;margin:37px 0;color:#81909b;font-size:12px;line-height:1.7;max-width:480px;}
.subtle-note svg{color:#729a86;}
.proof-feature{background:#172b46;border-radius:11px;color:#fff;padding:27px 29px 24px;box-shadow:0 16px 25px #162c4e12;}
.proof-feature-top{display:flex;justify-content:space-between;color:#ccb17f;font-size:10px;font-weight:800;letter-spacing:1.4px;}
.proof-feature h3{font-size:21px;letter-spacing:-.6px;margin:19px 0 24px;}
.proof-feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:23px;border-top:1px solid #ffffff2c;padding-top:20px;}
.proof-feature-grid span{font-size:9px;font-weight:800;color:#9daec0;letter-spacing:1.3px;}
.proof-feature-grid p{font-size:11px;color:#e0e7ef;line-height:1.65;margin:8px 0 0;}
.skills-header{display:flex;align-items:flex-end;justify-content:space-between;margin:30px 0 15px;gap:15px;}
.skills-header h2{font-size:19px;letter-spacing:-.6px;margin:0 0 6px;}.skills-header p{font-size:12px;color:#8894a2;margin:0;}
.small-count{font-size:10px;color:#a08d69;white-space:nowrap;}
.skill-list{display:grid;gap:9px;}
.skill-card{width:100%;display:flex;gap:15px;align-items:center;text-align:left;background:white;border:1px solid #e1e7ed;border-radius:9px;padding:14px 15px;}
.skill-card.chosen{border-color:#c4b28c;background:#fffefa;}
.skill-card:hover{border-color:#b29a6b;}
.skill-check{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:1px solid #cdd5df;border-radius:6px;flex-shrink:0;color:#fff;}
.skill-card.chosen .skill-check{background:var(--green);border-color:var(--green);}
.skill-content{display:grid;gap:5px;flex:1;}.skill-content strong{font-size:12px;}.skill-content span{font-size:11px;color:#8b98a6;line-height:1.5;}.skill-index{font-size:10px;color:#a2aeb8;}
.skills-footer{display:flex;justify-content:space-between;gap:12px;margin-top:22px;}
/* DASHBOARD SHELL */
.dashboard-page{background:#f8f9fa;min-height:calc(100vh - 164px);}
.dashboard-layout{max-width:1500px;display:grid;grid-template-columns:238px minmax(0,1fr);margin:auto;min-height:calc(100vh - 164px);}
.dashboard-sidebar{background:#fff;border-right:1px solid #e6eaef;padding:41px 20px 30px;display:flex;flex-direction:column;gap:34px;}
.side-overline{font-size:9px;font-weight:850;letter-spacing:1.6px;color:#a1adba;display:block;padding:0 15px;margin-bottom:15px;}
.sidebar-group{display:grid;gap:5px;}
.side-link{display:flex;align-items:center;width:100%;border:0;background:transparent;padding:13px 14px;text-align:left;border-radius:8px;gap:13px;color:#8a96a4;font-weight:680;font-size:12px;}
.side-link.selected{color:#183048;background:#f0f4f5;}.side-link.selected:before{content:"";width:3px;height:23px;border-radius:3px;background:#bb9b5f;position:absolute;margin-left:-14px;}
.side-link span{flex:1;}.side-link .icon:last-child:not(:first-child){color:#9da9b7;}.side-counter{font-size:10px;background:#e5f1eb;color:#50816a;padding:2px 6px;border-radius:20px;}
.sidebar-tip{padding:19px;border:1px solid #eee9d8;background:#fbf9f2;border-radius:10px;margin-top:auto;}
.sidebar-tip-icon{color:#b3945b;margin-bottom:11px;}.sidebar-tip strong{color:#3c4a58;font-size:12px;}.sidebar-tip p{font-size:11px;color:#89929b;line-height:1.65;margin:8px 0 0;}
.sidebar-reset{border:0;display:flex;align-items:center;gap:10px;color:#a0aab5;font-size:11px;background:transparent;padding-left:14px;}
.sidebar-reset:hover{color:#344960;}
.dashboard-main{min-width:0;padding:48px 54px 80px;max-width:1270px;width:100%;}
.dash-topline{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:27px;}
.dash-topline h1{font-size:33px;letter-spacing:-1.4px;font-weight:720;color:var(--navy);margin:8px 0 9px;line-height:1.25;}
.dash-topline p{font-size:13px;color:#8997a6;margin:0;line-height:1.5;}
.dashboard-date{border:1px solid #e2e8ec;border-radius:7px;background:#fff;display:flex;align-items:center;gap:9px;padding:11px 13px;color:#7d8c99;font-size:11px;white-space:nowrap;margin-top:16px;}
.dash-hero{display:grid;grid-template-columns:1fr 275px;min-height:222px;background:linear-gradient(105deg,#12283f,#1e3a58);border-radius:12px;color:#fff;overflow:hidden;position:relative;}
.dash-hero-copy{padding:34px 38px;position:relative;z-index:2;}.dash-hero-copy>span{font-size:9px;color:#c8ac72;letter-spacing:1.4px;font-weight:850;}.dash-hero-copy h2{font-size:26px;line-height:1.3;letter-spacing:-.7px;margin:13px 0 13px;}.dash-hero-copy h2 span{color:#d5b36f;}.dash-hero-copy p{color:#b7c5d1;font-size:12px;margin:0 0 18px;line-height:1.55;}.dash-hero-copy button{border:0;background:transparent;color:#e4c98b;font-weight:750;font-size:12px;padding:0;display:flex;align-items:center;gap:8px;}
.dash-hero-art{position:relative;overflow:hidden;}.orbit{position:absolute;border-radius:50%;border:1px solid #c1a46b43;}.orbit-one{width:270px;height:270px;top:-19px;left:8px;}.orbit-two{width:180px;height:180px;top:25px;left:54px;}
.orbit-center{width:82px;height:82px;border:1px solid #d5bd8a44;background:#cdb37a18;color:#dbc38d;border-radius:50%;display:flex;align-items:center;justify-content:center;position:absolute;top:73px;left:103px;}
.orbit-tag{position:absolute;background:#ffffff14;padding:8px 11px;font-size:8px;letter-spacing:1px;border:1px solid #ffffff25;border-radius:5px;color:#dcd4c1;}.orbit-tag.top{top:32px;left:11px}.orbit-tag.bottom{bottom:31px;right:7px}
.stats-strip{margin-top:20px;background:#fff;border:1px solid #e9edf0;border-radius:10px;display:grid;grid-template-columns:repeat(4,1fr);padding:23px 0;}
.stats-strip>div{padding:0 25px;display:grid;gap:8px;border-right:1px solid #e7edf2;}.stats-strip>div:last-child{border:0;}.stats-strip strong{font-size:27px;font-weight:700;letter-spacing:-.9px;line-height:1;color:#162c46;}.stats-strip span{color:#8d99a6;font-size:11px;}
.section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:38px 0 19px;}
.section-heading h2{font-size:22px;letter-spacing:-.8px;margin:7px 0;color:#1b3049;}.section-heading p{color:#8895a3;font-size:12px;margin:7px 0 0;line-height:1.6;}
.section-heading.small{margin-top:34px;}.section-heading.tighter{margin:0 0 20px;align-items:center;}.section-heading.tighter h2{margin:0 0 7px;}
.plain-link{font-size:12px;border:0;background:transparent;font-weight:750;display:flex;align-items:center;gap:8px;color:#b0884f;white-space:nowrap;padding:5px 0;}
.role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;}
.role-card{background:#fff;border:1px solid #e6eaee;border-radius:12px;padding:23px 24px 20px;min-width:0;display:flex;flex-direction:column;box-shadow:0 3px 8px #1d324a04;transition:transform .15s,box-shadow .15s;}

function inferSkills(story) {
  const text = [story.problem, story.action, story.outcome].join(' ').toLowerCase();
  return SKILLS.filter((skill) => skill.keywords.some((keyword) => text.includes(keyword)));
}

function evidenceForSkill(skill, proofs) {
  return proofs.find((proof) => proof.selectedSkills.includes(skill)) || null;
}

function evaluate(job, proofs) {
  const supported = [];
  const gaps = [];
  job.requirements.forEach((requirement) => {
    const proof = evidenceForSkill(requirement.skill, proofs);
    if (proof) supported.push({ ...requirement, proof });
    else gaps.push(requirement);
  });
  return { supported, gaps, count: supported.length };
}

function sortJobs(proofs) {
  return [...JOBS].sort((a, b) => {
    const diff = evaluate(b, proofs).count - evaluate(a, proofs).count;
    if (diff) return diff;
    return JOBS.indexOf(a) - JOBS.indexOf(b);
  });
}

function escapeHtml(value = '') {
  return String(value).replace(/[&<>"']/g, (character) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[character]));
}

function shortText(value = '', max = 146) {
  const normalized = String(value).trim().replace(/\s+/g, ' ');
  return normalized.length > max ? `${normalized.slice(0, max - 1).trimEnd()}…` : normalized;
}

function allSelectedSkills(proofs) {
  return [...new Set(proofs.flatMap((proof) => proof.selectedSkills))];
}

    <div class="profile-bottom-banner">${icon('shield',23)}<div><strong>Your story stays yours.</strong><p>These are self-reported work examples and suggested skill connections—not verified employment credentials. Employers only see the stories you submit.</p></div></div>
  `,'profile');
}
function jobDetail() {
  const job=activeJob(); const e=evaluate(job,state.proofs); const application=state.applications[job.id];
  return dashboardShell(`<button class="back-link" data-action="nav" data-view="discover">${icon('arrowLeft',17)} All opportunities</button>
    <div class="job-page-top"><div class="job-identity">${companyMark(job,'company-mark-large')}<div><span class="eyebrow-label">${esc(job.eyebrow)}</span><h1>${esc(job.title)}</h1><p>${esc(job.company)} <span>·</span> ${esc(job.location)} <span>·</span> ${esc(job.arrangement)}</p></div></div><div>${application?statusBadge(application.status):tag('Sample opening','gold')}</div></div>
    <div class="job-page-layout"><section class="job-main-column">
      <div class="job-value-hero"><div><span>YOUR EXPERIENCE MAY MATTER HERE</span><h2>See the connection<br/>before you apply.</h2><p>We mapped this role's requirements to the work you've actually described. Review both evidence and gaps—without a mystery match score.</p></div><div class="job-value-decoration">${icon('layers',66)}</div></div>
      <div class="job-section"><div class="section-heading tighter"><div><h2>Where your work connects</h2><p>Each example links back to an accomplishment you provided.</p></div>${tag(`${e.supported.length} supported`,'green')}</div>
        ${e.supported.length?e.supported.map(s=>`<div class="evidence-row"><div class="evidence-icon">${icon('check',18)}</div><div><strong>${esc(s.skill)}</strong><p>${esc(s.why)}</p><div class="evidence-source">${icon('file',15)} YOUR WORK: “${esc(shortText(s.proof.action,124))}”</div></div></div>`).join(''):`<div class="empty-state compact">No requirements are yet supported by selected proof. Add more detail to your work story to see relevant evidence.</div>`}
      </div>
      <div class="job-section gaps"><div class="section-heading tighter"><div><h2>What's still unclear</h2><p>Not evidenced doesn't mean unqualified; it means we haven't seen supporting work yet.</p></div>${tag(`${e.gaps.length} to explore`)}</div>
        ${e.gaps.map(s=>`<div class="gap-row"><span>${icon('circle',18)}</span><div><strong>${esc(s.skill)}</strong><p>${esc(s.why)}</p></div></div>`).join('')||'<p class="all-evidenced">Every listed requirement has supporting evidence in your selected work stories.</p>'}
      </div>
      <div class="job-section company-about"><span class="eyebrow-label">THE COMPANY</span><h2>About ${esc(job.company)}</h2><p>${esc(job.about)}</p><div class="about-mission"><span>TEAM FOCUS</span><strong>${esc(job.mission)}</strong></div></div>
    </section><aside class="job-side-column"><div class="job-side-card"><span class="eyebrow-label">OPPORTUNITY DETAILS</span><div class="comp-label">Annual base salary</div><div class="comp-amount">${esc(job.pay)}</div><div class="job-side-meta"><div>${icon('mapPin',17)} ${esc(job.location)}</div><div>${icon('briefcase',17)} ${esc(job.arrangement)}</div><div>${icon('shield',17)} Salary visible before interest</div></div><div class="job-side-divider"></div><p>Share the work examples you choose. Your identity isn't shown in the recruiter preview before mutual interest.</p>${application?button(`${application.status==='connected'?'View connection':application.status==='declined'?'View outcome':'View your interest'} ${icon('arrowRight',17)}`,'view-application','btn-primary btn-full') : button(`Express interest ${icon('arrowRight',18)}`,'open-interest','btn-primary btn-full') }<div class="job-side-foot">${icon('lock',15)} No real employer is contacted in this demo.</div></div>
        <div class="tip-card">${icon('sparkles',20)}<div><strong>Why this is different</strong><p>A hiring manager can see your relevant work before drawing conclusions from an unfamiliar title.</p></div></div>
      </aside></div>
    `,'discover');
}
function interest() {
  const job=activeJob(); const selected=state.selectedProofIds;
  return dashboardShell(`<button class="back-link" data-action="open-job" data-job="${job.id}">${icon('arrowLeft',17)} Back to opportunity</button>
    <div class="simple-page-heading"><span class="eyebrow-label">INTENTIONAL INTRODUCTIONS</span><h1>Show them why you're relevant<span class="gold-dot">.</span></h1><p>Choose the proof you want to share with ${esc(job.company)}. You're not sending a generic résumé into a queue.</p></div>
    <div class="interest-layout"><section><div class="editor-card"><div class="editor-card-header"><h2>01 <span>/</span> Select your work evidence</h2><p>Recruiters will see only the cards you explicitly select.</p></div>
      ${state.proofs.map(p=>`<button class="evidence-choice ${selected.includes(p.id)?'active':''}" data-action="toggle-proof" data-proof="${p.id}" aria-pressed="${selected.includes(p.id)}"><span class="choice-check">${selected.includes(p.id)?icon('check',17):''}</span><span><strong>${esc(p.title)}</strong><small>${esc(shortText(p.action,128))}</small><span class="choice-tags">${p.selectedSkills.slice(0,3).map(s=>`<em>${esc(s)}</em>`).join('')}</span></span></button>`).join('')}
      <div class="editor-card-header second"><h2>02 <span>/</span> Add a brief note</h2><p>Keep it human. Your work examples carry the detail.</p></div>
      <textarea class="field field-textarea interest-note" data-model="intro" rows="5" aria-label="Introduction note" placeholder="Why does this opportunity interest you?">${esc(state.intro)}</textarea>
      <div class="interest-foot"><span>${icon('shield',16)} You control what gets shared.</span>${button(`Send interest ${icon('arrowRight',17)}`,'submit-interest','btn-primary',selected.length?'':'disabled')}</div></div></section>
      <aside><div class="request-preview"><span class="eyebrow-label">INTRODUCTION PREVIEW</span><div class="preview-role">${companyMark(job)}<div><strong>${esc(job.title)}</strong><small>${esc(job.company)}</small></div></div><div class="divider"></div><div class="preview-anon">${icon('lock',16)} Shared without your name until both sides connect</div><h3>What the recruiter receives</h3><p>A short introduction, your selected Proof-of-Work Cards, supported skills, and open qualification questions.</p><div class="request-preview-bottom">${icon('checkCircle',18)} A higher-context introduction.</div></div></aside>
    </div>
    `,'discover');
}
function pending() {
  const job=activeJob(); const application=state.applications[job.id];
  if (!application) return dashboard();
  if (application.status==='connected') return connections();
  return dashboardShell(`<button class="back-link" data-action="nav" data-view="connections">${icon('arrowLeft',17)} Your introductions</button>
    <div class="pending-shell"><div class="pending-check">${icon(application.status==='declined'?'info':'check',33)}</div><span class="eyebrow-label">YOUR INTRODUCTION</span><h1>${application.status==='declined'?'Not moving forward this time.':'Your interest has been shared.'}</h1><p>${application.status==='declined'?'In this simulated scenario, the recruiter chose not to connect. Your proof is still available for other opportunities.':`Your selected work evidence is ready for review by ${esc(job.company)}. This is a local simulation; no real application has been sent.`}</p>
      <div class="pending-progress"><div class="pending-progress-step complete"><span>${icon('check',18)}</span><div><strong>You expressed interest</strong><small>Shared your selected work evidence</small></div></div><div class="progress-track"></div><div class="pending-progress-step ${application.status==='declined'?'complete':''}"><span>${application.status==='declined'?icon('check',18):icon('clock',18)}</span><div><strong>Recruiter review</strong><small>${application.status==='declined'?'Demo decision recorded':'Awaiting a demo decision'}</small></div></div><div class="progress-track"></div><div class="pending-progress-step"><span>${icon('message',18)}</span><div><strong>Mutual connection</strong><small>Messaging unlocks if the recruiter accepts</small></div></div></div>
      <div class="pending-demo-callout"><div>${icon('users',22)}</div><div><strong>Continue the demo from the other side</strong><p>See exactly what the recruiter receives and decide whether to connect. Clearly simulated—no real employer activity.</p></div></div>
      <div class="pending-buttons">${button(`Open recruiter demo ${icon('arrowRight',17)}`,'recruiter-open','btn-primary')}${button('Explore more roles','discover','btn-outline')}</div>
    </div>
    `,'connections');
}
function recruiter() {
  const appEntries=Object.entries(state.applications).filter(([,a])=>a.status==='interested');
  const current=state.applications[state.activeJobId]?.status==='interested'?state.activeJobId:appEntries[0]?.[0];
  if (!current) {
    return `<main class="recruiter-page"><div class="recruiter-topbar"><div>${wordmark()}<span class="recruiter-switch-pill">RECRUITER DEMO · SIMULATED</span></div>${button(`${icon('arrowLeft',17)} Back to candidate`,'home','btn-outline')}</div><div class="recruiter-empty"><div class="empty-icon">${icon('users',32)}</div><span class="eyebrow-label">RECRUITER PERSPECTIVE</span><h1>No pending introductions yet.</h1><p>Start as Maya and express interest in a role. Then return here to see the candidate's evidence as the recruiter would.</p>${button(`Explore candidate roles ${icon('arrowRight',17)}`,'discover','btn-primary')}</div></main>`;
  }
  state.activeJobId=current;
  const job=jobById(current); const application=state.applications[current];
  const sharedProofs=application.sharedProofs || state.proofs.filter(p=>application.proofIds.includes(p.id)); const e=evaluate(job,sharedProofs);
  return `<main class="recruiter-page"><div class="recruiter-topbar"><div class="recruiter-brand">${wordmark()}<span class="recruiter-switch-pill">RECRUITER DEMO · SIMULATED</span></div>${button(`${icon('arrowLeft',17)} Candidate view`,'home','btn-outline')}</div>
    <div class="recruiter-body"><div class="recruiter-aside"><span class="side-overline">HIRING WORKSPACE</span><div class="recruiter-company">${companyMark(job)}<div><strong>${esc(job.company)}</strong><span>Hiring for ${esc(job.title)}</span></div></div><div class="recruiter-selected">${icon('users',18)} <span>Introductions</span><span class="recruiter-count">${appEntries.length}</span></div><div class="recruiter-aside-note">${icon('shield',20)}<p>Sample recruiter account. Applications and decisions exist only in your browser.</p></div></div>
    <div class="recruiter-content"><div class="recruiter-content-head"><div><span class="eyebrow-label">NEW INTRODUCTION · CANDIDATE-INITIATED</span><h1>See the work behind the candidate.</h1><p>A candidate you might not have found by searching for previous PM titles.</p></div>${tag('Awaiting review','gold')}</div>
    <div class="recruiter-candidate"><div class="anonymous-avatar">${icon('lock',24)}</div><div><span class="mini-label">PRIVATE CANDIDATE · ID #014</span><h2>${esc(state.currentRole)} <span>→</span> ${esc(state.targetRole)}</h2><p>${esc(state.experience)} of experience · Identity shown after mutual connection</p></div></div>
    <div class="recruiter-grid"><section class="recruiter-main"><div class="recruiter-section-title"><span>01</span><h3>Why this person may fit</h3></div><div class="recruiter-map">${e.supported.map(s=>`<div class="recruiter-match"><div class="match-left"><span class="supported-circle">${icon('check',16)}</span><strong>${esc(s.skill)}</strong><small>${esc(shortText(s.proof.action,155))}</small></div><div class="match-right"><span>ROLE REQUIREMENT</span><p>${esc(s.why)}</p></div></div>`).join('')||'<p>No requirements are supported by the selected work stories.</p>'}</div>
        <div class="recruiter-section-title second"><span>02</span><h3>Original work evidence</h3></div>${sharedProofs.map(p=>`<div class="recruiter-proof"><h4>${esc(p.title)}</h4><div class="proof-detail"><strong>PROBLEM</strong><p>${esc(p.problem)}</p></div><div class="proof-detail"><strong>ACTION</strong><p>${esc(p.action)}</p></div><div class="proof-detail"><strong>OUTCOME</strong><p>${esc(p.outcome)}</p></div></div>`).join('')}
      </section><aside class="recruiter-right"><div class="recruiter-note"><span>FROM THE CANDIDATE</span><p>“${esc(application.intro)}”</p></div><div class="recruiter-gaps"><h3>${icon('alert',18)} Still to evaluate</h3><p>Missing evidence is not proof of missing ability.</p>${e.gaps.map(g=>`<div>${icon('circle',15)}<span>${esc(g.skill)}</span></div>`).join('')||'<span>All listed requirements have supporting evidence.</span>'}</div><div class="recruiter-actions"><span class="eyebrow-label">YOUR DECISION</span><h3>Worth a conversation?</h3><p>Your decision—not an algorithm—determines the next step.</p>${button(`${icon('handshake',18)} Invite to connect`,'recruiter-accept','btn-primary btn-full')}${button('Not this time','recruiter-decline','btn-outline btn-full')}</div></aside></div>
    <div class="recruiter-bottom">${icon('info',17)} This is an interactive simulation. The recruiter action is performed by the demo reviewer, not a real hiring team.</div></div></div>
  </main>`;
}
function connections() {
  const apps=Object.entries(state.applications).map(([id,a])=>({job:jobById(id),a}));
  const current=state.applications[state.activeJobId]?.status==='connected'?state.activeJobId:apps.find(x=>x.a.status==='connected')?.job.id;
  const job=current?jobById(current):null;
  const items=current ? (state.messages[current]||[]) : [];
  return dashboardShell(`<div class="dash-topline"><div><span class="eyebrow-label">YOUR NEXT CONVERSATION</span><h1>Connections built on work<span class="gold-dot">.</span></h1><p>Direct messages unlock only after both you and the recruiter express interest.</p></div><div class="dashboard-date">${icon('lock',17)} Your conversations are local demo data</div></div>
    ${!apps.length?`<div class="empty-connections"><div class="empty-icon">${icon('handshake',28)}</div><h2>Your introductions will appear here.</h2><p>Find a role, share work evidence, and express interest to begin.</p>${button(`Explore opportunities ${icon('arrowRight',17)}`,'discover','btn-primary')}</div>`:`<div class="connections-layout"><section class="connections-list"><div class="connections-list-heading">YOUR INTRODUCTIONS <span>${apps.length}</span></div>${apps.map(({job:j,a})=>`<button class="connection-item ${current===j.id?'active':''}" data-action="connection-select" data-job="${j.id}">${companyMark(j)}<div><strong>${esc(j.company)}</strong><small>${esc(j.title)}</small>${statusBadge(a.status)}</div></button>`).join('')}</section><section class="conversation-area">${job?`<div class="conversation-top">${companyMark(job)}<div><strong>${esc(job.company)}</strong><span>${esc(job.recruiter)} · ${esc(job.recruiterTitle)}</span></div>${tag('Mutual interest','green')}</div><div class="conversation-subhead">${icon('handshake',18)} Connected through your ${esc(state.proofs[0]?.title||'work evidence')}</div><div class="message-list"><div class="conversation-day">SIMULATED DEMO CONVERSATION</div>${items.map(m=>`<div class="bubble-wrap ${m.sender==='candidate'?'mine':'theirs'}"><div class="bubble">${esc(m.text)}</div><small>${m.sender==='candidate'?'You':esc(job.recruiter)}</small></div>`).join('')}</div><form id="message-form" class="composer"><input id="message-input" name="message" value="${esc(typingMessage)}" placeholder="Write a message…" autocomplete="off" aria-label="Your message"/><button type="submit" aria-label="Send message">${icon('send',20)}</button></form>`:`<div class="conversation-placeholder"><div class="empty-icon">${icon('clock',27)}</div><h2>Still waiting for a decision.</h2><p>Open the simulated recruiter view to review the evidence and accept an introduction.</p>${button(`Open recruiter demo ${icon('arrowRight',17)}`,'recruiter-open','btn-primary')}</div>`}</section></div>`}
  `,'connections');
}
function layout() {
  const onboard=['welcome','story','skills'].includes(state.view);
  const recruiterView=state.view==='recruiter';
  let content;
  switch(state.view) {
    case 'welcome': content=welcome(); break;
    case 'story': content=story(); break;
    case 'skills': content=skillsView(); break;
    case 'home': content=dashboard(); break;
    case 'discover': content=discover(); break;
    case 'profile': content=profile(); break;
    case 'job': content=jobDetail(); break;
    case 'interest': content=interest(); break;
    case 'pending': content=pending(); break;
    case 'recruiter': content=recruiter(); break;
    case 'connections': content=connections(); break;
    default: content=welcome();
  }
  return `${recruiterView?'':header()}${content}${recruiterView?'':footer()}${state.toast?`<div class="toast" role="status">${icon('info',18)} ${esc(state.toast)}<button data-action="dismiss-toast">${icon('close',16)}</button></div>`:''}`;
}
function render() { persist(); appEl.innerHTML=layout(); document.title=`Pathline — ${state.view==='welcome'?'Your next role starts with your work':state.view==='recruiter'?'Recruiter demo':state.view==='discover'?'Explore roles':'Evidence-first career transitions'}`; }
function focusAfterRender(id,start,end) { render(); const el=document.getElementById(id); if (el) { el.focus(); if (typeof el.setSelectionRange==='function' && start!=null) el.setSelectionRange(start,end); } }

appEl.addEventListener('input', e=>{
  const t=e.target;
  if (t.dataset.story) state.draft[t.dataset.story]=t.value;
  if (t.dataset.model) {
    state[t.dataset.model]=t.value;
    if (t.dataset.model==='search') {
      const start=t.selectionStart,end=t.selectionEnd;
      focusAfterRender('role-search',start,end);
    }
  }
  if (t.id==='message-input') typingMessage=t.value;
  persist();
});
appEl.addEventListener('change', e=>{
  const t=e.target;
  if (t.dataset.model && t.tagName==='SELECT') {state[t.dataset.model]=t.value;render();}
});
appEl.addEventListener('submit', e=>{
  if (e.target.id==='message-form') {
    e.preventDefault();
    const job=activeJob(); const text=typingMessage.trim();
    if (!text||state.applications[job.id]?.status!=='connected') return;
    state.messages[job.id] ||= [];
    state.messages[job.id].push({sender:'candidate',text}); typingMessage=''; render();
    const list=document.querySelector('.message-list'); if(list) list.scrollTop=list.scrollHeight;
    const input=document.querySelector('#message-input'); if(input) input.focus();
  }
});
appEl.addEventListener('click', e=>{
  const target=e.target.closest('[data-action]'); if(!target||target.disabled)return;
  const act=target.dataset.action;
  const jobId=target.dataset.job;
  switch(act) {
    case 'nav':
      if (!eligibleForNav() && !['welcome','story','skills'].includes(target.dataset.view)) return;
      go(target.dataset.view); break;
    case 'home': go('home'); break;
    case 'discover': go('discover'); break;
    case 'mobile-menu': state.sidebarMobile=!state.sidebarMobile; render(); break;
    case 'start':
      if (!state.currentRole.trim()||!state.targetRole.trim()) {toast('Add your current and next role to continue.');return;}
      state.editingProofId=null; state.draft={...DEMO_STORY}; go('story'); break;
    case 'sample-story': state.draft={...DEMO_STORY, id:state.draft.id}; render();break;
    case 'analyze-story': {
      const d=state.draft;
      if(!d.problem.trim()||!d.action.trim()||!d.outcome.trim()) {toast('Complete the problem, action, and outcome fields first.');return;}
      const inferred=inferSkills(d);
      state.suggestedSkills=inferred;
      state.selectedSkills=inferred.filter(x=>state.editingProofId ? (state.proofs.find(p=>p.id===state.editingProofId)?.selectedSkills||[]).includes(x.name) : (state.draft.id===DEMO_STORY.id ? DEMO_STORY.selectedSkills.includes(x.name) : true)).map(x=>x.name);
      go('skills');break;
    }
    case 'toggle-skill': {
      const skill=target.dataset.skill;
      state.selectedSkills=state.selectedSkills.includes(skill)?state.selectedSkills.filter(x=>x!==skill):[...state.selectedSkills,skill];render();break;
    }
    case 'edit-story':go('story');break;
    case 'confirm-skills': {
      if(!state.selectedSkills.length) {toast('Please select at least one skill your work supports.');return;}
      const id=state.editingProofId||'proof-'+Date.now();
      const proof={...state.draft,id,selectedSkills:[...state.selectedSkills]};
      const index=state.proofs.findIndex(p=>p.id===id);
      if(index===-1) state.proofs.push(proof);else state.proofs[index]=proof;
      state.editingProofId=null;
      go(state.proofs.length===1&&index===-1?'home':'profile'); break;
    }
    case 'add-proof':state.editingProofId=null;state.draft={id:'',title:'',problem:'',action:'',outcome:'',selectedSkills:[]};go('story');break;
    case 'edit-proof': {
      const proof=state.proofs.find(p=>p.id===target.dataset.proof);if(!proof)return;
      state.editingProofId=proof.id;state.draft={...proof};go('story');break;
    }
    case 'open-job':changeJob(jobId);break;
    case 'open-interest': {
      state.selectedProofIds=state.proofs.map(p=>p.id);
      state.intro=`I'm transitioning from ${state.currentRole} into ${state.targetRole}. In my previous work, ${shortText(state.proofs[0]?.action||'I solved meaningful problems with my team',150).replace(/\.$/,'').replace(/^I /,'I ')}. I'd love to discuss how that experience could translate to your team.`;
      go('interest');break;
    }
    case 'toggle-proof': {
      const id=target.dataset.proof;
      state.selectedProofIds=state.selectedProofIds.includes(id)?state.selectedProofIds.filter(x=>x!==id):[...state.selectedProofIds,id];render();break;
    }
    case 'submit-interest': {
      if(!state.selectedProofIds.length)return;
      const job=activeJob();
      state.applications[job.id]={status:'interested',proofIds:[...state.selectedProofIds],sharedProofs:state.proofs.filter(p=>state.selectedProofIds.includes(p.id)).map(p=>({...p,selectedSkills:[...p.selectedSkills]})),intro:state.intro.trim()||`I'm interested in ${job.title} and would love to share how my past work may translate.`,timestamp:new Date().toISOString()};
      go('pending');break;
    }
    case 'view-application': {
      const application=state.applications[state.activeJobId];
      go(application?.status==='connected'?'connections':'pending');break;
    }
    case 'recruiter-open':go('recruiter');break;
    case 'recruiter-accept': {
      const job=activeJob();const application=state.applications[job.id]; if(!application)return;
      application.status='connected';
      state.messages[job.id] ||= [{sender:'recruiter',text:`Hi ${state.name.split(' ')[0]}! ${job.recruiterOpener}`}];
      go('connections');break;
    }
    case 'recruiter-decline': {
      const application=state.applications[state.activeJobId]; if(!application)return;
      application.status='declined';go('pending');break;
    }
    case 'connection-select': {
      state.activeJobId=jobId;
      const status=state.applications[jobId]?.status;
      go(status==='connected'?'connections':'pending');break;
    }
    case 'clear-search':state.search='';state.arrangement='All';render();break;
    case 'dismiss-toast':state.toast='';render();break;
    case 'reset':
      if(window.confirm('Restart the Pathline demo? This clears all locally saved sample progress.')) {
        try{localStorage.removeItem(KEY)}catch(_){} state=freshState();typingMessage='';go('welcome');
      }
      break;
    default:break;
  }
});

render();
</script></body></html>
